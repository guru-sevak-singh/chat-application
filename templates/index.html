<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Chat UI</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            height: 100vh;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .app {
            width: 95%;
            height: 95vh;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
        }

        /* CONTACT PANEL */

        .contacts {
            width: 30%;
            background: linear-gradient(180deg, #4facfe, #00f2fe);
            display: flex;
            flex-direction: column;
        }

        .contacts-header {
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
            font-weight: bold;
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
        }

        .add-user {
            background: white;
            border: none;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        .contact-list {
            flex: 1;
            overflow-y: auto;
        }

        .contact {
            display: flex;
            align-items: center;
            padding: 15px;
            cursor: pointer;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
        }

        .contact:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: white;
            color: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            margin-right: 10px;
        }

        /* CHAT AREA */

        .chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #f5f6fa;
        }

        .chat-header {
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .chat-user {
            display: flex;
            align-items: center;
        }

        .back-btn {
            display: none;
            margin-right: 10px;
            cursor: pointer;
            font-size: 18px;
        }

        .chat-buttons button {
            margin-left: 10px;
            padding: 6px 10px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        /* MESSAGES */

        .messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .message-wrapper {
            display: flex;
            flex-direction: column;
            margin-bottom: 10px;
            max-width: 60%;
        }

        .sent {
            align-self: flex-end;
        }

        .received {
            background-color: #ccc;
            color: black;
            padding: 10px;
            border-radius: 10px;
        }

        .message {
            padding: 10px;
            border-radius: 10px;
            background: #667eea;
            color: white;
        }

        .timestamp {
            font-size: 11px;
            color: #777;
            margin-top: 3px;
            text-align: right;
        }

        /* INPUT */

        .input-area {
            display: flex;
            padding: 10px;
            background: white;
            border-top: 1px solid #ddd;
        }

        .input-area input {
            flex: 1;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }

        .input-area button {
            margin-left: 10px;
            padding: 10px 15px;
            border: none;
            background: #667eea;
            color: white;
            border-radius: 6px;
            cursor: pointer;
        }

        /* POPUP */

        .popup {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
        }

        .popup-box {
            background: white;
            padding: 20px;
            border-radius: 10px;
            width: 300px;
        }

        .popup-box input {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        .popup-box button {
            margin-top: 10px;
            padding: 8px 12px;
            border: none;
            background: #667eea;
            color: white;
            border-radius: 6px;
            cursor: pointer;
        }

        /* MOBILE VIEW */

        @media (max-width:768px) {

            .app {
                flex-direction: column;
            }

            .contacts {
                width: 100%;
                height: 100%;
            }

            .chat {
                display: none;
                height: 100%;
            }

            .chat.active {
                display: flex;
            }

            .contacts.hide {
                display: none;
            }

            .back-btn {
                display: inline-block;
            }

        }

        /* ─── INCOMING AUDIO CALL MODAL ─── */

        #incoming-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        #incoming-modal.show {
            display: flex;
        }

        #modal-box {
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 10px;
            padding: 32px;
            text-align: center;
            min-width: 280px;
        }

        #modal-box .ring-icon {
            font-size: 40px;
            margin-bottom: 12px;
        }

        #modal-box .from-text {
            color: #888;
            font-size: 12px;
        }

        #modal-box .caller-id {
            color: #00ff88;
            font-size: 18px;
            margin: 8px 0 24px;
        }

        /* ─── INCOMING VIDEO RING MODAL ─── */

        #incoming-video-call-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        #incoming-video-call-modal.show {
            display: flex;
        }

        #modal-video-box {
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 10px;
            padding: 32px;
            text-align: center;
            min-width: 280px;
        }

        #modal-video-box .ring-icon {
            font-size: 40px;
            margin-bottom: 12px;
        }

        #modal-video-box .from-text {
            color: #888;
            font-size: 12px;
        }

        #modal-video-box .caller-id {
            color: #00ff88;
            font-size: 18px;
            margin: 8px 0 24px;
        }

        .modal-actions {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .accept-btn {
            padding: 10px 24px;
            background: #00aa55;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-family: monospace;
            font-size: 13px;
        }

        .accept-btn:hover {
            background: #00cc66;
        }

        .reject-btn {
            padding: 10px 24px;
            background: #aa2200;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-family: monospace;
            font-size: 13px;
        }

        .reject-btn:hover {
            background: #cc3300;
        }

        /* ─────────────────────────────────────────
           FULLSCREEN VIDEO CALL SCREEN
           Like Google Meet / WhatsApp video call
        ───────────────────────────────────────── */

        #video-call-screen {
            display: none;               /* hidden by default, show via JS */
            position: fixed;
            inset: 0;                    /* covers full screen */
            background: #0d0d0d;
            z-index: 200;
        }

        #video-call-screen.show {
            display: block;
        }

        /* Remote video — fills the entire screen */
        #remoteVideo {
            width: 100%;
            height: 100%;
            object-fit: cover;           /* fill without stretching */
            display: block;
        }

        /* 
            When remote video has no stream yet 
            (waiting for peer to connect) show a 
            dark placeholder with a message 
        */
        #remoteVideo:not([srcObject]) {
            background: #1a1a2e;
        }

        /* Remote user name — top left overlay */
        #remote-user-name {
            position: absolute;
            top: 20px;
            left: 24px;
            color: white;
            font-size: 15px;
            font-weight: 600;
            background: rgba(0, 0, 0, 0.45);
            padding: 6px 14px;
            border-radius: 20px;
            backdrop-filter: blur(6px);
            letter-spacing: 0.4px;
        }

        /* 
            Local video — picture-in-picture style
            bottom-right corner, small box 
        */
        #localVideo {
            position: absolute;
            bottom: 100px;               /* above the control bar */
            right: 20px;
            width: 160px;
            height: 110px;
            object-fit: cover;
            border-radius: 12px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
            cursor: pointer;             /* allow drag later if needed */
            background: #222;
        }

        /* ─── BOTTOM CONTROL BAR ─── */

        #video-controls {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            background: linear-gradient(to top, rgba(0,0,0,0.85), transparent);
            padding-bottom: 12px;
        }

        .ctrl-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.18);
            color: white;
            padding: 10px 22px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 20px;
            backdrop-filter: blur(8px);
            transition: background 0.2s ease;
            min-width: 80px;
        }

        .ctrl-btn span {
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        .ctrl-btn:hover {
            background: rgba(255, 255, 255, 0.22);
        }

        /* Active/muted state — button turns red tint */
        .ctrl-btn.active {
            background: rgba(220, 53, 69, 0.35);
            border-color: rgba(220, 53, 69, 0.5);
        }

        /* End call button — always red */
        .ctrl-btn.end-call-btn {
            background: #dc3545;
            border-color: #dc3545;
        }

        .ctrl-btn.end-call-btn:hover {
            background: #c82333;
        }

        /* ─── MOBILE ADJUSTMENTS ─── */
        @media (max-width: 768px) {

            #localVideo {
                width: 110px;
                height: 80px;
                bottom: 90px;
                right: 12px;
            }

            .ctrl-btn {
                padding: 10px 16px;
                min-width: 68px;
                font-size: 18px;
            }

        }

    </style>
</head>

<body>

    <div class="app">

        <div class="contacts">

            <div class="contacts-header">
                Contacts
                <button class="add-user" id="open-popup-btn">➕ Add</button>
            </div>

            <div class="contact-list" id="contacts"></div>

        </div>

        <div class="chat" id="chat">

            <div class="chat-header">

                <div class="chat-user">

                    <span class="back-btn" id="back-btn">⬅</span>

                    <div class="avatar" id="chatAvatar">A</div>
                    <span style="margin-left:10px" id="chatName">Select User</span>

                </div>

                <div class="chat-buttons">
                    <button id="call-btn">📞 Call</button>
                    <button id="video-call-btn">🎥 Video</button>
                </div>

            </div>

            <div class="messages" id="messages"></div>

            <div class="input-area">
                <input id="msgInput" placeholder="Type message">
                <button id="send-message-btn">Send</button>
            </div>

        </div>

    </div>

    <!-- ADD USER POPUP -->

    <div class="popup" id="popup">

        <div class="popup-box">

            <h3>Find Person</h3>

            <input id="newUserName" placeholder="Enter name / username">

            <button id="add-user-btn">Add User</button>
            <button id="close-popup">Cancel</button>

        </div>

    </div>

    <!-- INCOMING AUDIO CALL MODAL -->

    <div id="incoming-modal">
        <div id="modal-box">
            <div class="ring-icon">📞</div>
            <div class="from-text">Incoming call from</div>
            <div class="caller-id" id="caller-id-text">—</div>
            <div class="modal-actions">
                <button class="accept-btn" id="accept-call-btn">Accept</button>
                <button class="reject-btn" id="reject-call-btn">Reject</button>
            </div>
        </div>
    </div>

    <!-- INCOMING VIDEO RING MODAL (shows before accepting) -->

    <div id="incoming-video-call-modal">
        <div id="modal-video-box">
            <div class="ring-icon">📷</div>
            <div class="from-text">Incoming Video from</div>
            <div class="caller-id" id="caller-id-text-for-video">—</div>
            <div class="modal-actions">
                <button class="accept-btn" id="accept-video-btn">Accept</button>
                <button class="reject-btn" id="reject-video-btn">Reject</button>
            </div>
        </div>
    </div>

    <!-- 
        FULLSCREEN VIDEO CALL SCREEN
        Hidden by default — show this when call is accepted
        Add class "show" via JS to display it
    -->
    <div id="video-call-screen">

        <!-- Remote video — takes full screen background -->
        <video id="remoteVideo" autoplay playsinline></video>

        <!-- Remote user name label — top left -->
        <div id="remote-user-name">—</div>

        <!-- 
            Local video — picture-in-picture
            bottom right corner, small box
            muted so you don't hear your own voice echo
        -->
        <video id="localVideo" autoplay muted playsinline></video>

        <!-- Bottom control buttons -->
        <div id="video-controls">

            <button class="ctrl-btn" id="toggle-mic-btn">
                🎙️
                <span>Mute</span>
            </button>

            <button class="ctrl-btn" id="toggle-cam-btn">
                📷
                <span>Camera</span>
            </button>

            <button class="ctrl-btn end-call-btn" id="end-video-call-btn">
                📵
                <span>End</span>
            </button>

        </div>

    </div>

    <script>

        function addUser() {

            let name = document.getElementById("newUserName").value.trim()

            if (!name) return

            contacts.push({ name })

            renderContacts()

            closePopup()

            document.getElementById("newUserName").value = ""

        }

    </script>

    <script type="module" src="/static/js/index.js"></script>

    <script type="module" src="/static/js/rtc/main.js"></script>

    <script type="module" src="/static/js/video-rtc/main.js"></script>

</body>

</html>
